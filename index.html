    <style>
    /* ==========================================
       🔹 DESIGN SYSTEM — FLORA
       ========================================== */
    :root {
        /* Colors */
        --bg-cream: #FAF6F1;
        --bg-card: #ffffff;
        --navy: #14232F;
        --purple: #8B6BE8;
        --sage: #8CCFEA;
        --sage-light: #EFE9FD;
        --coral: #F76B55;
        --coral-light: #FFE3DD;
        --lime: #DAF76A;
        --gold: #DAF76A;
        --text-main: #14232F;
        --text-muted: #5B6B78;
        --border: #EAE3D8;
        
        /* Spacing & Sizing */
        --radius: 28px;
        --radius-sm: 16px;
        --shadow-sm: 0 1px 2px rgba(20, 35, 47, 0.05);
        --shadow-lg: 0 24px 60px rgba(20, 35, 47, 0.28);
        --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==========================================
       🔹 BASE STYLES
       ========================================== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: var(--bg-cream);
        color: var(--text-main);
        line-height: 1.5;
        padding-bottom: calc(2rem + env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
    }

    button, input, select {
        font-family: inherit;
    }

    /* ==========================================
       🔹 LOGIN SCREEN
       ========================================== */
    #login {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(20, 35, 47, 0.72);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0;} to {opacity:1;} }

    body.locked #login {
        display: flex;
    }

    body.locked header,
    body.locked .years,
    body.locked nav.tabs,
    body.locked main,
    body.locked .menu-reopen-btn {
        filter: blur(4px);
        pointer-events: none;
        user-select: none;
    }

    .lg-card {
        background: #fff;
        color: var(--navy);
        width: 100%;
        max-width: 400px;
        border-radius: 32px;
        padding: 2rem 1.75rem;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
    }

    .lg-card h2 {
        font-weight: 800;
        font-size: 1.55rem;
        letter-spacing: -0.6px;
    }

    .lg-card p {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-bottom: 0.25rem;
    }

    .lg-card input[type="text"],
    .lg-card input[type="password"] {
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-sm);
        border: 2px solid var(--border);
        background: var(--bg-cream);
        font-size: 0.92rem;
        color: var(--navy);
        transition: border-color var(--transition), background var(--transition);
    }

    .lg-card input:focus {
        outline: none;
        border-color: var(--purple);
        background: #fff;
    }

    .lg-keep {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.82rem;
        color: var(--text-muted);
        cursor: pointer;
    }

    .lg-card .btn-botanic {
        width: 100%;
        justify-content: center;
        margin-top: 0.25rem;
    }

    .lg-msg {
        min-height: 1.2rem;
        font-size: 0.82rem;
        font-weight: 700;
        color: #A93220;
    }

    .lg-link {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        transition: color var(--transition);
    }
    .lg-link:hover {
        color: var(--purple);
    }

    /* ==========================================
       🔹 HEADER
       ========================================== */
    header {
        background: var(--navy);
        color: #fff;
        padding: calc(1rem + env(safe-area-inset-top)) 1.5rem 1.4rem;
        border-radius: 0 0 36px 36px;
    }

    .header-inner {
        max-width: 1420px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 0.9rem;
    }

    .brand-logo {
        width: 54px;
        height: 54px;
        flex-shrink: 0;
    }

    .brand-text h1 {
        font-weight: 800;
        font-size: 2.1rem;
        letter-spacing: -1.2px;
        line-height: 1.1;
        text-transform: lowercase;
        color: #fff;
    }

    .brand-text h1::after {
        content: " ✦";
        color: var(--lime);
        font-size: 0.9rem;
        vertical-align: super;
    }

    .brand-text span {
        font-size: 0.78rem;
        color: #AEBBC5;
        letter-spacing: 0.4px;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        cursor: pointer;
        font-family: inherit;
        transition: background var(--transition), transform 0.15s ease;
    }
    .status-pill:hover {
        background: rgba(255, 255, 255, 0.18);
    }
    .status-pill:active {
        transform: scale(0.97);
    }

    /* ==========================================
       🔹 YEAR SELECTOR
       ========================================== */
    .years {
        display: flex;
        gap: 0.6rem;
        max-width: 1420px;
        margin: 1.1rem auto 0;
        padding: 0 1.5rem;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .years::-webkit-scrollbar { display: none; }

    .year-btn {
        border: none;
        font: inherit;
        font-weight: 800;
        font-size: 1rem;
        padding: 0.75rem 1.5rem;
        border-radius: 20px 20px 8px 8px;
        background: #fff;
        color: var(--navy);
        cursor: pointer;
        transition: background var(--transition), color var(--transition);
        white-space: nowrap;
        min-height: 44px;
    }

    .year-btn.active {
        background: var(--purple);
        color: #fff;
    }

    /* ==========================================
       🔹 TABS NAVIGATION
       ========================================== */
    nav.tabs {
        background: var(--bg-cream);
        max-height: 90px;
        opacity: 1;
        overflow: hidden;
        transition: max-height 0.28s ease, opacity 0.22s ease, margin 0.28s ease;
    }

    nav.tabs.nav-hidden {
        max-height: 0;
        opacity: 0;
        margin: 0;
        pointer-events: none;
    }

    .tabs-inner {
        max-width: calc(100% - 1.5rem);
        width: fit-content;
        background: var(--navy);
        border-radius: 999px;
        margin: 0.8rem auto;
        padding: 0.4rem;
        gap: 0.25rem;
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .tabs-inner::-webkit-scrollbar { display: none; }

    .tab-btn {
        border: none;
        background: transparent;
        color: #C9D3DB;
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 700;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--transition), color var(--transition);
        min-height: 40px;
    }

    .tab-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
    }

    .tab-btn.active {
        background: var(--lime);
        color: var(--navy);
    }

    .menu-reopen-btn {
        display: none;
        position: fixed;
        right: 1rem;
        bottom: calc(1rem + env(safe-area-inset-bottom));
        z-index: 60;
        border: none;
        background: var(--navy);
        color: var(--lime);
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 800;
        padding: 0.65rem 1.05rem;
        border-radius: 999px;
        box-shadow: 0 10px 24px rgba(20, 35, 47, 0.25);
        cursor: pointer;
        transition: transform var(--transition);
    }
    .menu-reopen-btn:hover {
        transform: translateY(-2px);
    }

    body.tabs-collapsed .menu-reopen-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
    }

    /* ==========================================
       🔹 MAIN CONTENT & LAYOUT
       ========================================== */
    main {
        max-width: 1420px;
        margin: 0 auto;
        padding: 1.6rem 1.5rem 3rem;
    }

    .tab-panel {
        display: none;
        animation: fadeIn 0.3s ease;
    }

    .tab-panel.active {
        display: block;
    }

    .section-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        margin-bottom: 1.4rem;
    }

    .section-title {
        font-weight: 800;
        font-size: clamp(1.5rem, 3vw, 2.1rem);
        letter-spacing: -1px;
        color: var(--forest-dark, var(--navy));
        line-height: 1.15;
    }

    .section-title::after {
        content: " ✦";
        color: var(--purple);
        font-size: 1.1rem;
        vertical-align: super;
    }

    .section-subtitle {
        color: var(--text-muted);
        font-size: 0.88rem;
    }

    /* ==========================================
       🔹 HERO CARDS GRID
       ========================================== */
    .hero-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        grid-template-rows: auto auto;
        gap: 1rem;
        margin-bottom: 1.6rem;
    }

    .hero-card {
        border-radius: var(--radius);
        padding: 1.6rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        overflow: hidden;
        min-height: 150px;
        transition: transform var(--transition);
    }
    .hero-card:hover {
        transform: translateY(-2px);
    }

    .hero-purple {
        grid-row: span 2;
        background: var(--purple);
        color: #fff;
        flex-wrap: wrap;
        min-height: 320px;
    }

    .hero-lime {
        background: var(--lime);
        color: var(--navy);
    }

    .hero-sky {
        background: var(--sage);
        color: var(--navy);
    }

    .hero-text {
        flex: 1 1 180px;
    }

    .hero-purple h2 {
        font-weight: 800;
        font-size: clamp(1.9rem, 4.2vw, 2.9rem);
        line-height: 1.02;
        letter-spacing: -1.5px;
        margin-bottom: 0.7rem;
    }

    .hero-purple .lime {
        color: var(--lime);
    }

    .hero-card h3 {
        font-weight: 800;
        font-size: 1.25rem;
        letter-spacing: -0.5px;
        line-height: 1.1;
        margin-bottom: 0.35rem;
    }

    .hero-card p {
        font-size: 0.88rem;
        opacity: 0.85;
    }

    .hero-art {
        width: min(100%, 330px);
        height: auto;
        flex: 0 1 300px;
    }

    .hero-art.sm {
        width: 110px;
        flex: 0 0 110px;
    }

    /* ==========================================
       🔹 MONTH PILLS
       ========================================== */
    .month-pills {
        display: flex;
        gap: 0.4rem;
        overflow-x: auto;
        padding-bottom: 0.6rem;
        margin-bottom: 1.4rem;
        scrollbar-width: none;
    }
    .month-pills::-webkit-scrollbar { display: none; }

    .month-pill {
        padding: 0.55rem 1.05rem;
        border-radius: 999px;
        border: none;
        background: #fff;
        color: var(--text-main);
        font-weight: 700;
        font-size: 0.82rem;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
        transition: background var(--transition), color var(--transition);
        min-height: 40px;
    }

    .
